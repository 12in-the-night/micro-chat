# ============================================================
# micro-chat: dense Mamba-2 LM for Raspberry Pi
# ============================================================

resume: null

tokenizer:
  vocab_size: 8192
  path: ./tokenizer.json
  train_corpus_mb: 200
  special_tokens: ["<pad>", "<s>", "</s>", "<unk>"]

data:
  split_train: train
  split_val: validation
  min_chars: 64
  shuffle_buffer: 5000
  sources:
    - name: roneneldan/TinyStories
      config: null
      weight: 1.0
    # drop TinyStoriesInstruct for pure story model
    # - name: roneneldan/TinyStoriesInstruct
    #   config: null
    #   weight: 0.5

training:
  seed: 42
  seq_len: 448          # 7 x chunk(64)
  batch: 96
  grad_accum: 10        # effective = 960
  loss_chunk: 32
  steps: 20000
  lr: 6.0e-4
  warmup: 100
  min_lr_frac: 0.1
  weight_decay: 0.1
  log_every: 10
  eval_every: 200
  eval_batch: 128
  ckpt_every: 500
  ckpt_dir: ./ckpts
  remat: true
  precision: fp16

optim:
  clip_norm: 1.0
  adafactor:
    enabled: false
  # ... rest unchanged

model:
  d_model: 256
  n_layers: 13
  tie_embeddings: true

mamba2:
  d_state: 64
  d_conv: 4
  chunk: 64
  expand: 2
  head_dim: 64
  ssd_lowp: true
