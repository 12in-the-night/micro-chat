# ============================================================
# micro-chat: dense Mamba-2 LM for Raspberry Pi
# ============================================================

resume: null

tokenizer:
  vocab_size: 8192
  path: ./tokenizer.json
  train_corpus_mb: 50
  special_tokens: ["<pad>", "<s>", "</s>", "<unk>"]

data:
  split_train: train
  split_val: validation
  min_chars: 64
  shuffle_buffer: 5000
  sources:
    - name: roneneldan/TinyStories
      config: null
      weight: 1.0
    - name: roneneldan/TinyStoriesInstruct
      config: null
      weight: 0.5

training:
  seed: 42
  seq_len: 400
  batch: 542
  grad_accum: 2
  steps: 1500
  lr: 6.0e-4
  warmup: 50
  min_lr_frac: 0.1
  weight_decay: 0.15
  log_every: 10
  eval_every: 100
  eval_batch: 128
  ckpt_every: 100
  ckpt_dir: ./ckpts
  remat: true
  precision: auto

optim:
  clip_norm: 1.0
  adafactor:
    enabled: true
    min_dim_size_to_factor: 128
    decay_rate: 0.8
    decay_offset: 0
    multiply_by_parameter_scale: false
    clipping_threshold: 1.0
    momentum: 0.9

model:
  d_model: 192
  n_layers: 16
  tie_embeddings: true

mamba2:
  d_state: 32
  d_conv: 4
  chunk: 100
  expand: 2
  head_dim: 64

awq:
  enabled: true
  alpha: 0.5
  calib_batches: 32
  calib_batch_size: 8

postprocess:
  input_ckpt: ./ckpts/ckpt_final.pkl
  output_dir: ./ckpts_compressed
  layer_keep_ratio: 0.75
  prune_method: influence
  export_path: ./pi_model.npz
